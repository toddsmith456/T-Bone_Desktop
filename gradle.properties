# The desktop build targets a normal developer machine; these settings also keep
# the build comfortable on a small (2 GB) container.
org.gradle.jvmargs=-Xmx1200m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx700m
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=false
kotlin.code.style=official
