# Local (non-Flathub) build of T-Bone Desktop.
# Not submittable to Flathub as-is: Flathub requires building from source
# (git source + build-args for the Gradle cache) rather than shipping a
# prebuilt app image. See packaging/README.md for the Flathub-submission gap.
app-id: io.github.toddsmith456.tbone-desktop
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: tbone-desktop
finish-args:
  # Nostr relays over wss://
  - --share=network
  # Skiko GL + AWT
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Export nsec/backup files the user explicitly saves
  - --filesystem=xdg-download
modules:
  - name: t-bone-desktop
    buildsystem: simple
    build-commands:
      - install -d /app/opt/t-bone-desktop
      - cp -a app-image/. /app/opt/t-bone-desktop/
      - install -Dm755 tbone-desktop-run /app/bin/tbone-desktop
      - install -Dm644 io.github.toddsmith456.tbone-desktop.desktop /app/share/applications/io.github.toddsmith456.tbone-desktop.desktop
      - install -Dm644 io.github.toddsmith456.tbone-desktop.png /app/share/icons/hicolor/256x256/apps/io.github.toddsmith456.tbone-desktop.png
    sources:
      - type: dir
        path: ../../desktop/build/compose/binaries/main/app/t-bone-desktop
        dest: ../../desktop/build/compose/binaries/main/app/t-bone-desktop
      - type: file
        path: tbone-desktop-run
      - type: file
        path: io.github.toddsmith456.tbone-desktop.desktop
      - type: file
        path: io.github.toddsmith456.tbone-desktop.png
